name: C++ CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles" -DBUILD_TESTING=ON

      - name: Build application and tests
        shell: msys2 {0}
        run: cmake --build build --target StudentManagementSystem StudentManagementTests --parallel

      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
